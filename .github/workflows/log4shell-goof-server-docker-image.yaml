name: log4shell-goof-server Docker image build and test

on:
  push:
    branches:
      - 'main'
    paths:
      - 'log4shell-goof/log4shell-goof-server/**'
      - '.github/workflows/log4shell-goof-server-docker-image.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'log4shell-goof/log4shell-goof-server/**'
      - '.github/workflows/log4shell-goof-server-docker-image.yaml'
  workflow_dispatch:
    inputs:
      description:
        description: 'Description'
        required: true
        type: string
      
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for code scanning

env:
  DOCKER_REPO: 'marco-dev-docker'
  IMAGE_NAME: 'log4shell-goof:${{ github.run_number }}'
  JF_URL: ${{ vars.JF_URL }}
  JF_PROJECT: ${{ vars.JF_PROJECT }}
  DOCKER_CLI_EXPERIMENTAL: enabled

jobs:
  build-log4shell-server-image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: log4shell-goof/log4shell-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup JFrog CLI 🐸
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: https://${{ vars.JF_URL }}/
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_TOKEN }}

      - name: Health check JFrog Artifactory instance 🐸
        run: |
          jf --version
          jf rt ping
          jf config show
          docker logout ${{ vars.JF_URL }}

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3                 

      - name: Authenticate Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_URL }}
          username: ${{ secrets.JF_USERNAME }}
          password: ${{ secrets.JF_TOKEN }}

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v1

      - name: docker CLI build
        run: |
          docker buildx ls
          echo "show version"
          jf docker --version
          echo "build docker image"
          jf docker build --tag ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME}} --platform linux/amd64 --metadata-file metadata.json .
          echo "docker push ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME}}"
          jf docker push ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME}} --project marco
          echo "finish docker push."

      # - name: Build
      #   uses: docker/build-push-action@v2
      #   with:
      #     load: true
      #     context: log4shell-goof/log4shell-server
      #     push: true
      #     tags: log4shell-server:latest
          
      - name: docker scan
        run: |  
            jf docker pull ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}
            jf docker scan ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}   

      - name: publish build info
        run: |
          jf rt build-collect-env 
          jf rt build-add-dependencies .
          jf rt build-add-git
          jf rt build-publish

