name: log4shell-maven build and deploy

on:
  push:
    branches:
      - 'main'
    paths:
      - 'log4shell-goof/log4shell-goof-client/**'
      - '.github/workflows/log4shell-maven.yaml'
  pull_request:
    branches:
      - 'main'
    paths:
      - 'log4shell-goof/log4shell-goof-client/**'
      - '.github/workflows/log4shell-maven.yaml'
  workflow_dispatch:
    inputs:
      description:
        description: 'Description'
        required: true
        type: string
      
permissions:
  actions: read # for detecting the Github Actions environment.
  id-token: write # for creating OIDC tokens for signing.
  packages: write # for uploading attestations.
  contents: read
  security-events: write # Required for code scanning

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_PROJECT: ${{ vars.JF_PROJECT }}

jobs:
  build-log4shell-client-image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: log4shell-goof/log4shell-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Setup JFrog CLI 🐸
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: https://${{ vars.JF_URL }}

          # JF_USER: ${{secrets.JF_USERNAME}}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_ACCESS_TOKEN: ${{secrets.JF_TOKEN}}
        # with:
        #     oidc-provider-name: github-oidc-marco
        #     oidc-audience: Marco Morales

      - name: Health check JFrog Artifactory instance 🐸
        run: |
          jf mvn-config --repo-deploy-releases ${{vars.JF_MAVEN_REPO}} --repo-deploy-snapshots ${{vars.JF_MAVEN_REPO}} --repo-resolve-releases ${{vars.JF_MAVEN_REPO}} --repo-resolve-snapshots ${{vars.JF_MAVEN_REPO}}
          jf --version
          jf rt ping
          jf config show
          echo "Show the maven.yaml contents"
          cat .jfrog/projects/maven.yaml

      - name: maven build
        run: |
          echo "show version"
          mvn --version
          echo "maven build"
          mvn clean verify
          echo "maven build - with wrapper"
          jf mvn clean verify
          echo "maven deploy"
          jf mvn deploy

      - name: publish build info
        run: |
          jf rt build-collect-env 
          jf rt build-add-dependencies .
          jf rt build-add-git
          jf rt build-publish

